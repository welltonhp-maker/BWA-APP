<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWA 체성분 환자용 해설기</title>
    <!-- PWA 설정 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b6cb0">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; max-width: 720px; margin: 20px auto; padding: 15px; background: #f4f7f9; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1a365d; border-bottom: 3px solid #2b6cb0; padding-bottom: 10px; margin-top: 0; }
        .grid-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2d3748; font-size: 13px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        button { background: #2b6cb0; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #2c5282; }
        #result { margin-top: 20px; padding: 20px; background: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 6px; white-space: pre-line; line-height: 1.7; color: #1a202c; }
        .loading { color: #dd6b20; font-weight: bold; display: none; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏥 BWA 체성분 환자용 해설기 (PWA)</h2>
    
    <div class="form-group">
        <label>Google Gemini API Key (최초 1회 입력 시 자동 저장)</label>
        <input type="password" id="apiKey" placeholder="발급받은 API 키를 입력하세요">
    </div>

    <div class="grid-group">
        <div>
            <label>환자 기본 정보</label>
            <input type="text" id="patientInfo" placeholder="예: 68세 / 여성">
        </div>
        <div>
            <label>BMI (체질량지수)</label>
            <input type="text" id="bmi" placeholder="예: 26.8 kg/m² (과체중)">
        </div>
    </div>

    <div class="grid-group">
        <div>
            <label>골격근량 (SMM / SMI)</label>
            <input type="text" id="smm" placeholder="예: SMI 5.2 kg/m² (근감소주의)">
        </div>
        <div>
            <label>근육량 (SLM / 부위별)</label>
            <input type="text" id="slm" placeholder="예: 하체 불균형 (좌측 5% 부족)">
        </div>
    </div>

    <div class="form-group">
        <label>체지방량 & 체지방률 (PBF)</label>
        <input type="text" id="pbf" placeholder="예: 체지방량 25.5kg, 체지방률 38.2% (비만)">
    </div>

    <button onclick="generateReport()">환자용 해설문 생성하기</button>

    <div id="loading" class="loading">⏳ BWA 공식 기준에 맞춰 해설문을 작성 중입니다...</div>
    <div id="result">수치를 입력하고 버튼을 누르면 환자 설명용 해설이 여기에 출력됩니다.</div>
</div>

<script>
// 저장된 API 키가 있으면 자동 불러오기
window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }
}

// PWA Service Worker 등록
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('PWA Service Worker 등록 완료', reg))
        .catch(err => console.log('Service Worker 실패', err));
}

async function generateReport() {
    const apiKey = document.getElementById('apiKey').value;
    const patientInfo = document.getElementById('patientInfo').value;
    const bmi = document.getElementById('bmi').value;
    const smm = document.getElementById('smm').value;
    const slm = document.getElementById('slm').value;
    const pbf = document.getElementById('pbf').value;

    if (!apiKey) {
        alert("API Key를 입력해 주세요.");
        return;
    }

    // 입력한 API 키 로컬 저장
    localStorage.setItem('gemini_api_key', apiKey);

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').innerText = '';

    const systemInstruction = `
[Role]
당신은 병원 환자에게 BWA/InBody 체성분 검사 결과를 알기 쉽게 설명해 주는 '친절한 전문 건강 상담 AI'입니다.

[Official Evaluation Standards]
- 골격근량(SMI): 60세 이상 기준 남성 7.0, 여성 5.7 kg/m² 이하 시 근감소증 위험.
- 근육량(SLM): 하체 3% 이상 불균형 시 관절 과하중 주의.
- 체지방률(PBF): 남성 18%, 여성 28% 이상 시 비만 및 관절 하중 증가.
- BMI: 18.5~25.0 kg/m² 표준 기준.

[Rules]
- 전문 용어 대신 '관절 지탱 힘', '체형 밸런스', '지방 하중' 등 쉬운 어휘를 사용하세요.
- 반드시 [한눈에 보는 나의 체성분 상태], [관절 & 건강 관리 포인트] 2개 영역으로 출력하세요.
`;

    const userPrompt = `
- 환자 정보: ${patientInfo}
- BMI: ${bmi}
- 골격근량 (SMM/SMI): ${smm}
- 근육량 및 부위별 균형 (SLM): ${slm}
- 체지방량 및 체지방률 (PBF): ${pbf}
`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: { temperature: 0.2 }
            })
        });

        const data = await response.json();
        const outputText = data.candidates[0].content.parts[0].text;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = outputText;
    } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').innerText = "오류가 발생했습니다. API 키 및 입력 값을 확인해 주세요.";
    }
}
</script>

</body>
</html>
